        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .scene-display {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .scene-text {
            color: white;
            font-size: 1.8rem;
            line-height: 1.6;
            animation: zoomIn 0.5s ease-out;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .new-scene-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .new-scene-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: #f8f8f8;
        }

        .new-scene-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .scene-text {
                font-size: 1.4rem;
            }

            .new-scene-btn {
                font-size: 1.1rem;
                padding: 1rem 2.5rem;
            }
        }
        /* --- Round mode --- */
        .timer-track {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.15);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .timer-track.visible {
            opacity: 1;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: white;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
            transform-origin: left center;
            transform: scaleX(1);
        }

        .timer-bar.filling {
            opacity: 0.55;
            box-shadow: none;
        }

        .timer-bar.low {
            animation: pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.35; }
        }

        .scene-text.shuffling {
            animation: none !important;
            opacity: 0.85;
        }

        .button-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .round-btn {
            background: transparent;
            color: white;
            border: 3px solid white;
        }

        .round-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .new-scene-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .scene-display.times-up {
            animation: timesUp 0.8s ease-out;
        }

        @keyframes timesUp {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.9); }
            100% { box-shadow: 0 0 0 30px rgba(255, 255, 255, 0); }
        }
    </style>
</head>

        // ---- Round timings (in seconds) — change these to taste ----
        const SHUFFLE_SECONDS = 15;   // rapid-fire shuffle before landing on a prompt
        const COUNTDOWN_SECONDS = 30; // time bar after the prompt is picked
        const SLOWDOWN_SECONDS = 4;   // last part of the shuffle that slows down to a stop

        const sceneText = document.getElementById('sceneText');
        const sceneDisplay = document.querySelector('.scene-display');
        const newSceneBtn = document.getElementById('newSceneBtn');
        const roundBtn = document.getElementById('roundBtn');
        const timerTrack = document.getElementById('timerTrack');
        const timerBar = document.getElementById('timerBar');

        let lastIndex = -1;
        let roundRunning = false;
        let shuffleTimeout = null;
        let countdownFrame = null;

        function getRandomScene() {
            let i;
            do { i = Math.floor(Math.random() * scenes.length); } while (i === lastIndex && scenes.length > 1);
            lastIndex = i;
            return scenes[i];
        }

        function displayNewScene() {
            sceneText.classList.remove('shuffling');
            sceneText.style.animation = 'none';
            void sceneText.offsetWidth; // restart the zoom animation
            sceneText.style.animation = 'zoomIn 0.5s ease-out';
            sceneText.textContent = getRandomScene();
        }

        // ---- Round mode ----
        function startRound() {
            roundRunning = true;
            roundBtn.textContent = 'Stop Round';
            newSceneBtn.disabled = true;
            sceneText.classList.add('shuffling');

            const start = performance.now();
            const total = SHUFFLE_SECONDS * 1000;
            const slowStart = total - SLOWDOWN_SECONDS * 1000;

            // Bar fills up across the top while the shuffle runs
            timerBar.classList.remove('low');
            timerBar.classList.add('filling');
            timerBar.style.transform = 'scaleX(0)';
            timerTrack.classList.add('visible');
            function fill() {
                const p = Math.min(1, (performance.now() - start) / total);
                timerBar.style.transform = 'scaleX(' + p + ')';
                if (p < 1 && roundRunning) countdownFrame = requestAnimationFrame(fill);
            }
            countdownFrame = requestAnimationFrame(fill);

            function tick() {
                const elapsed = performance.now() - start;
                if (elapsed >= total) {
                    cancelAnimationFrame(countdownFrame);
                    displayNewScene();
                    startCountdown();
                    return;
                }
                sceneText.textContent = getRandomScene();
                // Fast flicker, then ease out into longer gaps like a slot machine
                let delay = 45;
                if (elapsed > slowStart) {
                    const t = (elapsed - slowStart) / (total - slowStart); // 0 → 1
                    delay = 45 + t * t * 500;
                }
                shuffleTimeout = setTimeout(tick, delay);
            }
            tick();
        }

        function startCountdown() {
            const start = performance.now();
            const total = COUNTDOWN_SECONDS * 1000;
            timerBar.classList.remove('low', 'filling');
            timerBar.style.transform = 'scaleX(1)';
            timerTrack.classList.add('visible');

            function frame() {
                const remaining = Math.max(0, total - (performance.now() - start));
                timerBar.style.transform = 'scaleX(' + (remaining / total) + ')';
                if (remaining <= 5000) timerBar.classList.add('low');
                if (remaining > 0) {
                    countdownFrame = requestAnimationFrame(frame);
                } else {
                    finishRound(true);
                }
            }
            countdownFrame = requestAnimationFrame(frame);
        }

        function hideTimer() {
            timerTrack.classList.remove('visible');
            timerBar.classList.remove('low', 'filling');
        }

        function finishRound(timeUp) {
            clearTimeout(shuffleTimeout);
            cancelAnimationFrame(countdownFrame);
            roundRunning = false;
            roundBtn.textContent = 'Start Round';
            newSceneBtn.disabled = false;
            hideTimer();
            if (sceneText.classList.contains('shuffling')) displayNewScene();
            if (timeUp) {
                sceneDisplay.classList.remove('times-up');
                void sceneDisplay.offsetWidth;
                sceneDisplay.classList.add('times-up');
            }
        }

        newSceneBtn.addEventListener('click', displayNewScene);
        roundBtn.addEventListener('click', () => roundRunning ? finishRound(false) : startRound());

        // Keyboard shortcuts for streaming: N = new scene, R = start/stop round
        document.addEventListener('keydown', (e) => {
            if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
            const k = e.key.toLowerCase();
            if (k === 'r') roundBtn.click();
            else if (k === 'n' && !roundRunning) displayNewScene();
        });

        displayNewScene();
    </script>
